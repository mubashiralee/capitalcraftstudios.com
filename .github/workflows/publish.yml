# Publishes the site to GitHub Pages on every push to main, and only if the
# tests pass. What is published is the folder tools/make-site.mjs writes: the
# pages and what they load, without the tests and tools.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Run the tests
        run: node --test tests/
      - name: Put the published folder together
        run: node tools/make-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
